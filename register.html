<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Course Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">

  <section id="loginView">
    <div class="login-card">
      <h1>Create Student Account</h1>
      <p class="muted">Student Course Registration System</p>

      <form id="registerForm">
        <label>Student ID
          <input id="regId" placeholder="e.g. 2021004" pattern="\d{5,10}" title="5–10 digits" required autocomplete="off">
        </label>
        <label>Full Name
          <input id="regName" placeholder="e.g. Ali Hassan" required autocomplete="off">
        </label>
        <label>Password
          <input id="regPass" type="password" placeholder="At least 4 characters" minlength="4" required>
        </label>
        <label>Confirm Password
          <input id="regPass2" type="password" placeholder="Repeat your password" minlength="4" required>
        </label>
        <button class="btn primary full" type="submit">Create Account</button>
      </form>

      <p class="hint" style="margin-top:16px">
        Already have an account?
        <a href="index.html" style="color:#2563eb;font-weight:700">Sign In</a>
      </p>
    </div>
  </section>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
