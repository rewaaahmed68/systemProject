<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin-students">
  <header class="topbar">
    <div class="brand">📚 Course Registration System</div>
    <div class="userbox">
      <span id="whoami"></span>
      <button class="btn ghost small" id="logoutBtn">Logout</button>
    </div>
  </header>
  <nav class="tabs">
    <a class="tab" href="admin-courses.html">Manage Courses</a>
    <a class="tab" href="admin-sections.html">Manage Sections</a>
    <a class="tab active" href="admin-students.html">Student Records</a>
    <a class="tab" href="admin-registrations.html">Registrations</a>
    <a class="tab" href="admin-management.html">Manage Admins</a>
  </nav>
  <main>
    <div class="card">
      <div class="card-head"><h3>Add Student Record</h3></div>
      <form id="studentForm" class="form-grid">
        <label>Student ID <input id="stId" placeholder="2021004" required></label>
        <label>Full Name <input id="stName" placeholder="Ali Hassan" required></label>
        <label>Password <input id="stPass" value="1234" required></label>
        <label>Max Credit Hours <input id="stMax" type="number" min="1" value="18" required></label>
        <div class="form-actions">
          <button class="btn primary" type="submit">Add Student</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-head"><h3>Student Records</h3></div>
      <table class="table">
        <thead><tr>
          <th>ID</th><th>Name</th><th>Tuition</th><th>Max Credits</th>
          <th>Registered Credits</th><th>Courses</th><th>Actions</th>
        </tr></thead>
        <tbody id="studentRows"></tbody>
      </table>
    </div>
  </main>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
